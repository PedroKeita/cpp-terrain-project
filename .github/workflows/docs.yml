name: Deploy Doxygen Docs

on:
  push:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Doxygen
        run: sudo apt-get install -y doxygen graphviz

      - name: Generate Docs
        run: |
          # Clean previous
          rm -rf docs_output
          
          # Generate
          doxygen Doxyfile 2>&1 || echo "Doxygen completed"
          
          # Prepare output
          mkdir -p docs_output
          if [ -d "html" ]; then
            mv html/* docs_output/
          elif [ -d "docs/html" ]; then
            cp -r docs/html/* docs_output/
          else
            # Create simple index
            echo '<html><body><h1>Documentation</h1><p>Generated by Doxygen</p></body></html>' > docs_output/index.html
          fi

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs_output
          publish_branch: gh-pages