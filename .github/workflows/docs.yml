name: Deploy Documentation

on:
  push:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Prepare Build Environment
        run: |
          echo "Preparing build directory..."
          # Create a clean working directory
          mkdir -p /tmp/doxygen_workdir
          cd /tmp/doxygen_workdir
          
          # Copy source files
          cp -r "$GITHUB_WORKSPACE/include" .
          cp -r "$GITHUB_WORKSPACE/src" .
          cp "$GITHUB_WORKSPACE/Doxyfile" .
          cp "$GITHUB_WORKSPACE/README.md" .
          cp "$GITHUB_WORKSPACE/main.cpp" .
          cp "$GITHUB_WORKSPACE/CMakeLists.txt" .
          
          # Check what source files we have
          echo "Source files found:"
          find . -name "*.cpp" -o -name "*.h" -o -name "*.hpp" | wc -l

      - name: Generate Documentation
        run: |
          cd /tmp/doxygen_workdir
          echo "Generating Doxygen documentation..."
          
          # Create output directory
          mkdir -p output
          
          # Generate documentation
          doxygen Doxyfile 2>&1 | tee doxygen.log
          
          # Check if documentation was generated
          if [ -d "output/html" ] && [ -f "output/html/index.html" ]; then
            echo "Documentation generated successfully"
            echo "Files in output: $(find output/html -type f | wc -l)"
          else
            echo "Warning: Documentation may not have been generated properly"
            echo "Checking alternative locations..."
          
            # Check if HTML was generated in different location
            if [ -d "html" ] && [ -f "html/index.html" ]; then
              echo "Found documentation in html/ directory"
              mkdir -p output
              cp -r html/* output/
            fi
          fi

      - name: Prepare Documentation for Deployment
        run: |
          # Create deployment directory in workspace
          mkdir -p "$GITHUB_WORKSPACE/docs_for_deploy"
          
          # Copy generated documentation
          if [ -d "/tmp/doxygen_workdir/output/html" ]; then
            cp -r /tmp/doxygen_workdir/output/html/* "$GITHUB_WORKSPACE/docs_for_deploy/"
          elif [ -d "/tmp/doxygen_workdir/html" ]; then
            cp -r /tmp/doxygen_workdir/html/* "$GITHUB_WORKSPACE/docs_for_deploy/"
          else
            echo "Creating minimal documentation as fallback"
            cat > "$GITHUB_WORKSPACE/docs_for_deploy/index.html" << 'EOF'
            <!DOCTYPE html>
            <html>
            <head>
                <title>Project Documentation</title>
                <meta charset="UTF-8">
                <meta name="viewport" content="width=device-width, initial-scale=1.0">
            </head>
            <body>
                <h1>Project Documentation</h1>
                <p>Documentation is automatically generated using Doxygen.</p>
                <p>If you are seeing this page, there might be an issue with the Doxygen configuration.</p>
                <p>Check the GitHub Actions logs for more details.</p>
            </body>
            </html>
            EOF
          fi
          
          echo "Documentation ready in docs_for_deploy directory"
          ls -la "$GITHUB_WORKSPACE/docs_for_deploy/"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs_for_deploy
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'